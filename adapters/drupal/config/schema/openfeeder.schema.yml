openfeeder.settings:
  type: config_object
  label: 'OpenFeeder settings'
  mapping:
    enabled:
      type: boolean
      label: 'Enable OpenFeeder'
    description:
      type: string
      label: 'Site description override'
    max_chunks:
      type: integer
      label: 'Maximum chunks per response'
    api_key:
      type: string
      label: 'API key for content endpoint authentication'
    excluded_paths:
      type: sequence
      label: 'Excluded path prefixes'
      sequence:
        type: string
        label: 'Path prefix'
    excluded_content_types:
      type: sequence
      label: 'Excluded content type machine names'
      sequence:
        type: string
        label: 'Content type'
    author_display:
      type: string
      label: 'Author display mode (name or hidden)'
